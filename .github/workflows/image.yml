name: Publish image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out tags and Go version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}"
          tags="$image:$RELEASE_TAG"
          # Test releases are pre-releases and must not move :latest
          if [ "$PRERELEASE" != "true" ]; then tags="$tags,$image:latest"; fi
          echo "TAGS=$tags" >> "$GITHUB_ENV"
          echo "GO_VERSION=$(grep -m1 '^go ' go.mod | cut -d' ' -f2)" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          build-args: GO_VERSION=${{ env.GO_VERSION }}
          push: true
          tags: ${{ env.TAGS }}
